name: Linux performance admission

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FITFREED_RELEASE_VERSION: 0.1.0

concurrency:
  group: linux-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-performance:
    name: Production data performance on Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 95

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget \
            xauth \
            xvfb

      - name: Verify the Linux development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build the source-bound Linux package
        run: npm run package:linux

      - name: Verify the Linux package
        run: npm run verify:linux-package

      - name: Install the benchmark package
        run: |
          debian_package="src-tauri/target/release/bundle/deb/FitFreed_${FITFREED_RELEASE_VERSION}_amd64.deb"
          test -f "$debian_package"
          if dpkg-query -W fitfreed >/dev/null 2>&1; then
            exit 1
          fi
          test ! -e /usr/bin/fitfreed
          sudo apt-get install --yes "./$debian_package"
          test "$(dpkg-query -W -f='${Status}' fitfreed)" = "install ok installed"

      - name: Verify installed Linux cold-launch budget
        run: xvfb-run -a npm run benchmark:cold-launch

      - name: Remove the benchmark package
        if: always()
        run: |
          if dpkg-query -W fitfreed >/dev/null 2>&1; then
            sudo dpkg --purge fitfreed
          fi
          test ! -e /usr/bin/fitfreed

      - name: Verify full-scale import budgets
        run: npm run benchmark:import

      - name: Verify dense training-history budgets
        run: npm run benchmark:dense-history

      - name: Verify Insights read-model performance budgets
        run: npm run benchmark:insights
