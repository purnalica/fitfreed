name: Public macOS candidate admission

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version in the sealed candidate
        required: true
        type: string
      revision:
        description: Exact source revision in the sealed candidate
        required: true
        type: string
      build_run_id:
        description: Public macOS release run awaiting promotion
        required: true
        type: string
      artifact_id:
        description: Sealed candidate artifact from that release run
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 emitted when the candidate transport was sealed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fitfreed-public-macos-admission-${{ inputs.version }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  admit-candidate:
    name: Admit the sealed public macOS candidate
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out the admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Verify the originating protected candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FITFREED_ARTIFACT_ID: ${{ inputs.artifact_id }}
          FITFREED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          FITFREED_REVISION: ${{ inputs.revision }}
          FITFREED_VERSION: ${{ inputs.version }}
        run: >-
          npm run verify:macos-public-candidate-source --
          "$GITHUB_REPOSITORY"
          "$FITFREED_BUILD_RUN_ID"
          "$FITFREED_ARTIFACT_ID"
          "$FITFREED_VERSION"
          "$FITFREED_REVISION"

      - name: Download only that sealed candidate artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .artifacts/public-macos-candidate-transport
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Reopen the digest-bound candidate
        env:
          FITFREED_CANDIDATE: .artifacts/public-macos-candidate-admission/${{ inputs.version }}
          FITFREED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          FITFREED_TRANSPORT: .artifacts/public-macos-candidate-transport/candidate.tar.gz
        run: >-
          npm run unpack:public-release --
          "$FITFREED_TRANSPORT"
          "$FITFREED_CANDIDATE_SHA256"
          "$FITFREED_CANDIDATE"

      - name: Admit the installed candidate
        env:
          FITFREED_CANDIDATE: .artifacts/public-macos-candidate-admission/${{ inputs.version }}
          FITFREED_REVISION: ${{ inputs.revision }}
          FITFREED_VERSION: ${{ inputs.version }}
        run: >-
          npm run verify:macos-public-candidate --
          "$FITFREED_CANDIDATE"
          "$FITFREED_VERSION"
          "$FITFREED_REVISION"
