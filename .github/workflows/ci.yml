name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FITFREED_RELEASE_VERSION: 0.1.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Portable quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify the development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Verify architecture boundaries
        run: npm run check:architecture

      - name: Verify data contracts
        run: npm run check:data-contracts

      - name: Verify release contracts
        run: npm run check:release-contracts -- "$FITFREED_RELEASE_VERSION"

      - name: Verify translation catalogs
        run: npm run check:i18n

      - name: Verify presentation contracts
        run: npm run check:ui-contracts

      - name: Verify documentation links
        run: npm run check:docs

      - name: Test the presentation
        run: npm test

      - name: Test project automation
        run: npm run test:scripts

      - name: Build the presentation
        run: npm run build

      - name: Verify Rust formatting
        run: npm run format:check

      - name: Test domain and application crates
        run: cargo test --manifest-path src-tauri/Cargo.toml -p fitfreed-domain -p fitfreed-application

      - name: Audit JavaScript production and build dependencies
        run: npm run audit:dependencies

  packaged-macos-e2e:
    name: Packaged macOS E2E
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify the macOS development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install the pinned local release evidence tool
        run: npm run install:release-tools

      - name: Run the complete fast verification lane
        run: npm run test:fast

      - name: Verify Rust formatting and lint rules
        run: |
          npm run format:check
          npm run lint:rust

      - name: Prepare the private development release evidence
        run: npm run prepare:development-release -- "$FITFREED_RELEASE_VERSION"

      - name: Verify installation and failure boundaries
        run: npm run verify:development-release

      - name: Build and test the instrumented package
        run: npm run verify:e2e

      - name: Retain privacy-safe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-macos-e2e-failure
          path: .artifacts/e2e/evidence
          if-no-files-found: warn
          retention-days: 7
