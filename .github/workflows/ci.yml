name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FITFREED_RELEASE_VERSION: 0.1.0

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Portable quality and Linux host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      executable-fingerprint: ${{ steps.impact.outputs.executable-fingerprint }}
      full-verification: ${{ steps.decision.outputs.full-verification }}
      verification-reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Classify verification impact
        id: impact
        env:
          FITFREED_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FITFREED_CI_EVENT: ${{ github.event_name }}
          FITFREED_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-impact.mjs

      - name: Find prior complete verification for unchanged inputs
        id: evidence
        if: steps.impact.outputs.candidate-full-verification == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/ci-verification-evidence
          key: fitfreed-complete-verification-${{ steps.impact.outputs.executable-fingerprint }}
          lookup-only: true

      - name: Resolve required verification
        id: decision
        env:
          FITFREED_CI_CANDIDATE_FULL: ${{ steps.impact.outputs.candidate-full-verification }}
          FITFREED_CI_CLASSIFICATION_REASON: ${{ steps.impact.outputs.classification-reason }}
          FITFREED_CI_EVIDENCE_AVAILABLE: ${{ steps.evidence.outputs.cache-hit == 'true' }}
        run: node scripts/classify-ci-impact.mjs resolve

      - name: Verify documentation links
        run: npm run check:docs

      - name: Install Tauri Linux system dependencies
        if: steps.decision.outputs.full-verification == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Verify the development environment
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        if: >-
          steps.decision.outputs.full-verification == 'true' ||
          steps.impact.outputs.product-surface-verification == 'true' ||
          steps.impact.outputs.automation-verification == 'true'
        run: npm ci

      - name: Verify public product surfaces
        if: >-
          steps.decision.outputs.full-verification == 'true' ||
          steps.impact.outputs.product-surface-verification == 'true'
        run: |
          npm run check:product-surfaces
          npm run check:site

      - name: Verify product publication automation
        if: >-
          steps.decision.outputs.full-verification == 'true' ||
          steps.impact.outputs.product-surface-verification == 'true'
        run: |
          npm run test:product-site
          npm run check:pages-workflow
          npm run build:pages
          npm run verify:pages:preflight

      - name: Verify documentation and CI automation
        if: >-
          steps.decision.outputs.full-verification == 'true' ||
          steps.impact.outputs.automation-verification == 'true'
        run: |
          node --test scripts/classify-ci-impact.test.mjs
          node --test scripts/check-current-documentation.test.mjs scripts/check-public-documentation.test.mjs
          npm run check:workflows

      - name: Verify architecture boundaries
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:architecture

      - name: Verify GitHub Actions workflows
        if: steps.decision.outputs.full-verification == 'true'
        run: |
          npm run check:workflows
          npm run check:public-release-workflow

      - name: Verify pinned updater source and provenance
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:vendored-updater

      - name: Verify data contracts
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:data-contracts

      - name: Verify release contracts
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:release-contracts -- "$FITFREED_RELEASE_VERSION"

      - name: Verify the release upgrade matrix
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:upgrade-matrix

      - name: Verify translation catalogs
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:i18n

      - name: Verify live presentation inventory
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:presentation-inventory

      - name: Verify presentation contracts
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:ui-contracts

      - name: Test the presentation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm test

      - name: Test project automation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run test:scripts

      - name: Build the presentation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run build

      - name: Verify Rust formatting
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run format:check

      - name: Test the complete Linux desktop host
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run test:rust

      - name: Lint the complete Linux desktop host
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run lint:rust

      - name: Build the Linux Debian package
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run package:linux

      - name: Inspect the Linux Debian package
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run verify:linux-package

      - name: Inventory the exact Linux Debian package
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run inventory:linux-package

      - name: Verify clean Linux installation and removal
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run verify:linux-installation

      - name: Test the bounded updater refinement
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run test:vendor-updater

      - name: Audit JavaScript production and build dependencies
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run audit:dependencies

  packaged-macos-e2e:
    name: Packaged macOS E2E
    needs: quality
    if: needs.quality.outputs.full-verification == 'true'
    runs-on: macos-15
    timeout-minutes: 95

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify the macOS development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install the pinned local release evidence tool
        run: npm run install:release-tools

      - name: Run the complete fast verification lane
        run: npm run test:fast

      - name: Verify Rust formatting and lint rules
        run: |
          npm run format:check
          npm run lint:rust

      - name: Build and verify the native X6 review package
        run: |
          npm run build:x6-review
          npm run check:x6-review-bundle

      - name: Prepare the private development release evidence
        run: npm run prepare:development-release -- "$FITFREED_RELEASE_VERSION"

      - name: Verify cold-launch budget
        run: npm run benchmark:cold-launch

      - name: Verify full-scale import budgets
        run: npm run benchmark:import

      - name: Verify dense training-history budgets
        run: npm run benchmark:dense-history

      - name: Verify Insights read-model performance budgets
        run: npm run benchmark:insights

      - name: Verify update recovery preparation against the production application
        run: npm run verify:update-recovery-preparation

      - name: Verify installation and failure boundaries
        run: npm run verify:development-release

      - name: Build and test the instrumented package
        run: npm run verify:e2e

      - name: Verify packaged update replacement and recovery
        run: npm run verify:update-e2e

      - name: Retain privacy-safe failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-macos-e2e-failure
          path: |
            .artifacts/e2e/evidence
            .artifacts/update-e2e/evidence
          if-no-files-found: warn
          retention-days: 7

  packaged-linux-update-e2e:
    name: Packaged Linux update E2E
    needs: quality
    if: needs.quality.outputs.full-verification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 95

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux package and desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            policykit-1 \
            sqlite3 \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Verify the Linux development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build and verify native Debian update recovery
        run: xvfb-run -a npm run verify:linux-update-e2e

      - name: Retain privacy-safe Linux update failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-linux-update-e2e-failure
          path: .artifacts/linux-update-e2e/evidence
          if-no-files-found: warn
          retention-days: 7

  packaged-linux-e2e:
    name: Packaged Linux capability E2E
    needs: quality
    if: needs.quality.outputs.full-verification == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux package and desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Verify the Linux development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build, install, and test packaged Linux capability parity
        run: xvfb-run -a npm run verify:linux-e2e

      - name: Retain privacy-safe Linux capability failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-linux-e2e-failure
          path: .artifacts/e2e/evidence
          if-no-files-found: warn
          retention-days: 7

  packaged-windows-e2e:
    name: Packaged Windows capability E2E
    needs: quality
    if: needs.quality.outputs.full-verification == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify the Windows development environment
        run: npm run doctor

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Build, install, and test packaged Windows capability parity
        run: npm run verify:windows-e2e

      - name: Retain privacy-safe Windows capability failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-windows-e2e-failure
          path: .artifacts/e2e/evidence
          if-no-files-found: warn
          retention-days: 7

  windows-host:
    name: Windows native host and NSIS package verification
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore exact Windows host evidence when available
        id: evidence
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/windows-host-evidence
          key: fitfreed-windows-host-package-v1-${{ needs.quality.outputs.executable-fingerprint }}

      - name: Reopen exact Windows host evidence
        id: reopened
        env:
          FITFREED_EXECUTABLE_FINGERPRINT: ${{ needs.quality.outputs.executable-fingerprint }}
        run: >-
          node scripts/windows-verification-evidence.mjs verify
          .artifacts/windows-host-evidence
          "$env:FITFREED_EXECUTABLE_FINGERPRINT"

      - name: Resolve required Windows verification
        id: decision
        env:
          FITFREED_CI_CANDIDATE_FULL: ${{ needs.quality.outputs.full-verification }}
          FITFREED_CI_CLASSIFICATION_REASON: ${{ needs.quality.outputs.verification-reason }}
          FITFREED_CI_EVIDENCE_AVAILABLE: ${{ steps.reopened.outputs.evidence-valid }}
        run: node scripts/classify-ci-impact.mjs resolve

      - name: Install locked JavaScript dependencies
        if: steps.decision.outputs.full-verification == 'true'
        run: npm ci

      - name: Verify the Windows development environment
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run doctor

      - name: Verify architecture boundaries
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:architecture

      - name: Verify pinned updater source and provenance
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:vendored-updater

      - name: Verify data contracts
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:data-contracts

      - name: Verify release contracts
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:release-contracts

      - name: Verify the release upgrade matrix
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:upgrade-matrix

      - name: Verify performance policy
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:performance-policy

      - name: Verify public update configuration
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:public-update-config

      - name: Verify public release-signing configuration
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:public-release-signing-config

      - name: Verify public release policy
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:public-release-policy

      - name: Verify public macOS release workflow
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:public-release-workflow

      - name: Verify public Linux expansion workflow
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:public-linux-expansion-workflow

      - name: Verify Windows host workflow
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:windows-ci-workflow

      - name: Verify Pages workflow
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:pages-workflow

      - name: Verify public product surfaces
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:product-surfaces

      - name: Verify current documentation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:docs

      - name: Verify product site
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:site

      - name: Verify translation catalogs
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:i18n

      - name: Verify live presentation inventory
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:presentation-inventory

      - name: Verify presentation contracts
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run check:ui-contracts

      - name: Test portable Windows automation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run test:windows-scripts

      - name: Test the presentation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm test

      - name: Build the presentation
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run build

      - name: Verify Rust formatting
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run format:check

      - name: Test the complete Windows desktop host
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run test:rust

      - name: Lint the complete Windows desktop host
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run lint:rust

      - name: Test the updater on Windows
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run test:vendor-updater

      - name: Build the release-shaped Windows NSIS package
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run package:windows

      - name: Install, inventory, and remove the Windows NSIS package
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run inventory:windows-package

      - name: Verify synthetic Windows Authenticode orchestration and cleanup
        if: steps.decision.outputs.full-verification == 'true'
        run: npm run verify:windows-authenticode-smoke

      - name: Record exact successful Windows host evidence
        if: steps.decision.outputs.full-verification == 'true'
        env:
          FITFREED_EXECUTABLE_FINGERPRINT: ${{ needs.quality.outputs.executable-fingerprint }}
        run: >-
          node scripts/windows-verification-evidence.mjs record
          .artifacts/windows-host-evidence
          "$env:FITFREED_EXECUTABLE_FINGERPRINT"

      - name: Save successful Windows host evidence
        if: >-
          steps.decision.outputs.full-verification == 'true' &&
          steps.evidence.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/windows-host-evidence
          key: fitfreed-windows-host-package-v1-${{ needs.quality.outputs.executable-fingerprint }}

  verification-evidence:
    name: Record complete verification evidence
    needs: [quality, windows-host, packaged-macos-e2e, packaged-linux-e2e, packaged-linux-update-e2e, packaged-windows-e2e]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      needs.quality.outputs.full-verification == 'true' &&
      needs.windows-host.result == 'success' &&
      needs.packaged-macos-e2e.result == 'success' &&
      needs.packaged-linux-e2e.result == 'success' &&
      needs.packaged-linux-update-e2e.result == 'success' &&
      needs.packaged-windows-e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create immutable evidence marker
        env:
          FITFREED_EXECUTABLE_FINGERPRINT: ${{ needs.quality.outputs.executable-fingerprint }}
        run: |
          mkdir -p .artifacts/ci-verification-evidence
          printf '%s\n' "$FITFREED_EXECUTABLE_FINGERPRINT" \
            > .artifacts/ci-verification-evidence/fingerprint

      - name: Record successful complete verification
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .artifacts/ci-verification-evidence
          key: fitfreed-complete-verification-${{ needs.quality.outputs.executable-fingerprint }}
