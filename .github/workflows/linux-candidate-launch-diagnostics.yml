name: Linux candidate launch diagnostics

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version in the sealed candidate
        required: true
        type: string
      revision:
        description: Exact source revision in the sealed candidate
        required: true
        type: string
      source_run_id:
        description: Workflow run that retained the sealed candidate
        required: true
        type: string
      artifact_id:
        description: Exact sealed candidate artifact to diagnose
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 emitted when the candidate transport was sealed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fitfreed-linux-launch-diagnostics-${{ inputs.version }}-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  diagnose-candidate:
    name: Diagnose one exact Ubuntu 24.04 candidate launch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out the diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Use the supported Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Install candidate diagnostic runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            at-spi2-core \
            dbus-daemon \
            fluxbox \
            sqlite3 \
            x11-utils \
            xauth \
            xvfb

      - name: Download only the exact sealed candidate artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          digest-mismatch: error
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .artifacts/linux-candidate-diagnostic-transport
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Reopen the digest-bound candidate
        env:
          FITFREED_CANDIDATE: .artifacts/linux-candidate-diagnostics/${{ inputs.version }}
          FITFREED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          FITFREED_TRANSPORT: .artifacts/linux-candidate-diagnostic-transport/candidate.tar.gz
        run: >-
          npm run unpack:public-release --
          "$FITFREED_TRANSPORT"
          "$FITFREED_CANDIDATE_SHA256"
          "$FITFREED_CANDIDATE"

      - name: Verify the signed exact candidate
        env:
          FITFREED_CANDIDATE: .artifacts/linux-candidate-diagnostics/${{ inputs.version }}
        run: npm run verify:public-release -- "$FITFREED_CANDIDATE"

      - name: Observe one exact Debian first launch
        env:
          FITFREED_CANDIDATE: .artifacts/linux-candidate-diagnostics/${{ inputs.version }}
          FITFREED_REVISION: ${{ inputs.revision }}
          FITFREED_VERSION: ${{ inputs.version }}
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: >-
          xvfb-run -a dbus-run-session --
          scripts/run-linux-desktop-session.sh
          npm run diagnose:linux-candidate-launch --
          "$FITFREED_CANDIDATE"
          "$FITFREED_VERSION"
          "$FITFREED_REVISION"
          "24.04"

      - name: Remove residual candidate package after diagnosis
        if: always()
        run: |
          if dpkg-query -W fitfreed >/dev/null 2>&1; then
            sudo apt-get purge --yes fitfreed
          fi
          test ! -e /usr/bin/fitfreed
          test ! -e /usr/share/applications/fitfreed.desktop
