name: Bug report
description: Report reproducible incorrect FitFreed behavior using synthetic evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real provider exports, user libraries, routes, screenshots, logs, or diagnostics containing personal data. Security vulnerabilities must follow SECURITY.md instead of this public form.
  - type: input
    id: version
    attributes:
      label: FitFreed version or revision
      description: Use a release version or commit identifier without including private paths.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system
      description: Include the operating-system version and architecture.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and its user-visible impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the behavior that should have occurred.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and independently constructed synthetic input. Do not paste sanitized copies of real records.
    validations:
      required: true
  - type: textarea
    id: recovery
    attributes:
      label: Recovery and persistence
      description: Explain whether the problem remains after restart and whether data, installation, or update recovery was affected.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains no real or derived personal data, credentials, private email addresses, or sensitive diagnostics.
          required: true
        - label: This is not a security vulnerability.
          required: true
